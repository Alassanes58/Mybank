services:
  frontend:
    image: node:20
    container_name: mybank_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  backend:
    image: php:8.2-cli
    container_name: mybank_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: sh -c "php -S 0.0.0.0:8000 -t public"
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: mybank_database
    restart: always
    environment:
      MYSQL_DATABASE: mybank
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: mybank_user
      MYSQL_PASSWORD: mybank_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: